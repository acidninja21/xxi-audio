<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XXI Audio">
<meta name="theme-color" content="#0A0907">
<title>XXI fin. — Trending Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Mrs+Saint+Delafield&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0907;--gold:#B8862B;--gold-hi:#E2B85A;--cream:#F4EFE6;--muted:rgba(244,239,230,.62);--line:rgba(184,134,43,.34);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--top) + 8px) 12px 18px;
  background:linear-gradient(to bottom,rgba(10,9,7,.85),rgba(10,9,7,.4) 70%,rgba(10,9,7,0));pointer-events:none}
header>*{pointer-events:auto}
.hrow{display:flex;align-items:center;justify-content:space-between}
.ibtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative}
.ibtn svg{width:22px;height:22px}
.ibtn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold-hi);display:none}
.ibtn.has .dot{display:block}
.tabs{display:flex;gap:18px;font-weight:600;font-size:15px}
.tab{color:rgba(244,239,230,.55);padding:6px 0;position:relative;transition:.2s}
.tab.on{color:var(--cream)}
.tab.on::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:2px;border-radius:2px;background:var(--gold-hi)}
.sub{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(10,9,7,.55);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--cream)}
.pill b{color:var(--gold-hi);font-weight:600}

/* ---------- feed ---------- */
main{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
main::-webkit-scrollbar{display:none}
.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--bg)}
.bgart{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.1);opacity:0;transform:scale(1.1);transition:opacity .6s}
.bgart.on{opacity:.45}
.card::before{content:"";position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 50% 35%,rgba(184,134,43,.10),transparent 60%),linear-gradient(to bottom,rgba(10,9,7,.15) 0%,rgba(10,9,7,.05) 40%,rgba(10,9,7,.9) 78%,#0A0907 100%)}
.art{position:absolute;z-index:2;left:50%;top:calc(var(--top) + 15dvh);transform:translateX(-50%);width:min(72vw,40dvh,340px);aspect-ratio:1;border-radius:18px;
  overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(184,134,43,.12);background:#110E09}
.art img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.art img.on{opacity:1}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:repeating-radial-gradient(circle at 50% 50%,#15120C 0 2px,#0E0C08 2px 4px)}
.art .ph::after{content:"";width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--gold-hi),var(--gold));box-shadow:0 0 30px rgba(226,184,90,.35)}
.paused{position:absolute;z-index:4;left:50%;top:calc(var(--top) + 15dvh + min(36vw,20dvh,170px));transform:translate(-50%,-50%) scale(.8);
  width:74px;height:74px;border-radius:50%;background:rgba(10,9,7,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;pointer-events:none}
.paused svg{width:30px;height:30px;margin-left:4px}
.card.isPaused .paused{opacity:1;transform:translate(-50%,-50%) scale(1)}

.info{position:absolute;z-index:3;left:16px;right:84px;bottom:calc(var(--bot) + 26px)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.b{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:6px}
.b.hot{background:var(--gold-hi);color:#140F06}
.b.new{background:var(--cream);color:#140F06}
.b.rise{background:rgba(226,184,90,.18);color:var(--gold-hi);border:1px solid rgba(226,184,90,.45)}
.b.peak{background:rgba(244,239,230,.1);color:var(--cream);border:1px solid rgba(244,239,230,.25)}
h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:34px;line-height:1.02;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.artist{font-size:14px;color:var(--muted);margin-top:3px}
.heat{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.heat .big{font-weight:700;font-size:15px;color:var(--gold-hi)}
.heat .big small{font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.heat .src{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.how{margin-top:10px;font-size:13.5px;line-height:1.4;max-width:46ch}
.how b{color:var(--gold-hi);font-weight:600}
.good{margin-top:8px;font-size:12.5px;color:var(--cream)}
.good b{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);margin-right:7px}
.more{color:var(--gold-hi);font-weight:600;font-size:13px;margin-left:4px}
.tags{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.tag{flex:none;font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(10,9,7,.45)}
.tag.s{background:rgba(184,134,43,.22);border-color:rgba(226,184,90,.55)}
.ebar{display:inline-flex;gap:2px;margin-left:2px;vertical-align:middle}
.ebar i{width:8px;height:3px;border-radius:2px;background:rgba(244,239,230,.2)}
.ebar i.f{background:var(--gold-hi)}

.rail{position:absolute;z-index:3;right:8px;bottom:calc(var(--bot) + 30px);display:flex;flex-direction:column;align-items:center;gap:14px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--cream);text-decoration:none;width:60px}
.rb .c{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,9,7,.5);border:1px solid var(--line);backdrop-filter:blur(6px)}
.rb svg{width:22px;height:22px}
.rb.on .c{background:var(--gold);border-color:var(--gold);color:#140F06}
.rb.noted .c{border-color:var(--gold-hi);color:var(--gold-hi)}
.mdisc{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;background:#15120C center/cover;animation:spin 5s linear infinite;animation-play-state:paused}
.card.playing .mdisc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{position:absolute;z-index:4;left:0;right:0;bottom:calc(var(--bot) + 0px);height:3px;background:rgba(244,239,230,.1)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-hi))}
.ptxt{position:absolute;z-index:4;right:12px;bottom:calc(var(--bot) + 8px);font-size:10px;color:var(--muted)}
.burst{position:absolute;z-index:6;pointer-events:none;font-size:90px;color:var(--gold-hi);text-shadow:0 0 30px rgba(226,184,90,.7);transform:translate(-50%,-50%) scale(.3);opacity:0;animation:burst .8s ease-out forwards}
@keyframes burst{30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.end>*{position:relative;z-index:2}
.end p{color:var(--muted);font-size:14px;line-height:1.5;margin-top:12px;max-width:320px}
.logo{display:flex;align-items:baseline;gap:4px;justify-content:center}
.logo .xxi{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:46px;color:var(--gold)}
.logo .fin{font-family:"Mrs Saint Delafield",cursive;font-size:54px;color:var(--cream);line-height:.6}
.empty{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;color:var(--muted);gap:14px}
.gbtn{background:var(--gold);color:#140F06;font-weight:600;font-size:14px;padding:12px 22px;border-radius:999px}
.obtn{border:1px solid var(--line);font-weight:600;font-size:14px;padding:12px 22px;border-radius:999px}
.fab{position:fixed;z-index:15;left:50%;transform:translateX(-50%);top:calc(var(--top) + 92px);display:none}
.fab.show{display:block}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:86dvh;overflow-y:auto;background:#12100C;border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:10px 18px calc(var(--bot) + 22px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(244,239,230,.25);margin:0 auto 14px}
.sheet h3{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;margin-bottom:4px}
.lab{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-hi);margin:18px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:rgba(184,134,43,.06);font-size:13px;font-weight:500;padding:8px 13px;border-radius:999px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#140F06}
.chip small{opacity:.55;margin-left:3px}
.row{display:flex;gap:10px;margin-top:20px}
.row>*{flex:1}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(244,239,230,.08);margin-top:16px;font-size:14px}
.sw{width:46px;height:28px;border-radius:999px;background:rgba(244,239,230,.15);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--cream);transition:.2s}
.sw.on{background:var(--gold)}
.sw.on::after{left:21px}
input[type=search],textarea{width:100%;background:#0A0907;border:1px solid var(--line);color:var(--cream);font:15px Inter,sans-serif;padding:13px 14px;border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold-hi)}
.res{margin-top:12px}
.ri{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(244,239,230,.06);width:100%;text-align:left}
.ri .th{width:44px;height:44px;border-radius:8px;background:#1A1610 center/cover;flex:none;border:1px solid var(--line)}
.ri .t{font-weight:600;font-size:14px}
.ri .a{font-size:12px;color:var(--muted)}
.ri .x{margin-left:auto;font-size:11px;color:var(--gold-hi);white-space:nowrap}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:14px;line-height:1.45;margin-top:10px}
.dl dt{color:var(--gold-hi);font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding-top:3px}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--bot) + 90px);transform:translate(-50%,20px);background:var(--cream);color:#140F06;font-weight:600;font-size:13px;
  padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

#start{position:fixed;inset:0;z-index:70;background:radial-gradient(ellipse at 50% 40%,rgba(184,134,43,.16),transparent 60%),#0A0907;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;cursor:pointer}
#start .big{font-family:"Cormorant Garamond",serif;font-size:34px;margin-top:20px}
#start p{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.55;max-width:300px}
#start .gbtn{margin-top:26px;font-size:15px;padding:15px 34px}
#start.hide{display:none}
@media (max-height:700px){h2{font-size:28px}.how{font-size:12.5px}.rail{gap:9px}.rb .c{width:42px;height:42px}.art{top:calc(var(--top) + 13dvh);width:min(60vw,34dvh)}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button class="ibtn" id="bSearch" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <nav class="tabs" id="tabs"></nav>
    <button class="ibtn" id="bFilter" aria-label="Filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="dot"></span></button>
  </div>
  <div class="sub" id="sub"></div>
</header>
<main id="feed"></main>
<button class="gbtn fab" id="copyFab">Copy saved list</button>
<audio id="aud" preload="auto" playsinline></audio>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="shFilter">
  <div class="grab"></div><h3>Filter & sort</h3>
  <div class="lab">Sort</div><div class="chips" id="cSort"></div>
  <div class="lab">Show</div><div class="chips" id="cShow"></div>
  <div class="lab">Mood</div><div class="chips" id="cMood"></div>
  <div class="lab">Style</div><div class="chips" id="cStyle"></div>
  <div class="tog"><span>Auto-swipe when a preview ends</span><button class="sw" id="swAuto" aria-label="Auto-swipe"></button></div>
  <div class="row"><button class="obtn" id="fReset">Reset</button><button class="gbtn" id="fDone">Show <span id="fCount"></span></button></div>
</section>
<section class="sheet" id="shSearch">
  <div class="grab"></div><h3>Search audio</h3>
  <input type="search" id="q" placeholder="Song, artist, vibe or idea (e.g. gym, wedding, piano)" autocomplete="off">
  <div class="res" id="qres"></div>
</section>
<section class="sheet" id="shNote">
  <div class="grab"></div><h3 id="nTitle">Note</h3>
  <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Your filming idea for this audio. Saving a note also stars it.</p>
  <textarea id="nText" placeholder="e.g. Use for Friday's gym transformation reel"></textarea>
  <div class="row"><button class="obtn" id="nDel">Clear</button><button class="gbtn" id="nSave">Save note</button></div>
</section>
<section class="sheet" id="shMore"><div class="grab"></div><div id="moreBody"></div></section>
<div class="toast" id="toast"></div>

<div id="start">
  <div class="logo"><span class="xxi" style="font-size:56px">XXI</span><span class="fin" style="font-size:64px">fin.</span></div>
  <div class="big">Trending audio</div>
  <p>A fresh mix every time you open it,<br>sounds you haven’t seen first.<br>Tap to pause · double-tap to save.</p>
  <div class="gbtn">Tap to start 🔊</div>
</div>

<script>
/* ---------- config ---------- */
const MOODS=[["hype","High energy","⚡"],["motivational","Motivational","💪"],["chill","Chill","🌊"],["sad","Sad / emotional","🥀"],["romantic","Romantic","🤍"],["luxury","Luxury / aesthetic","🥂"],["playful","Playful / funny","😏"]];
const MLABEL=Object.fromEntries(MOODS.map(m=>[m[0],m[1]]));
const STYLE_ORDER=["Trend sound","Pop","Hip-Hop / Rap","R&B / Soul","Electronic / House","Phonk / Funk","Latin","K-Pop","Indie / Acoustic","Piano / Cinematic","Jazz / Lounge","Slowed & Sped up","Rock","Country","World","Christmas"];
const TABS=[["all","For You"],["charts","Charts"],["new","New"],["saved","Saved"]];
const SHOWS=[["hot","🔥 Hot only"],["instr","🎹 Instrumentals"],["orig","🗣 Trend sounds"],["biz","💼 Best for business"],["unseen","👀 Not seen yet"]];
const SORTS=[["pop","For You mix"],["chart","Most popular"],["rise","Rising fastest"],["calm","Calm → hype"],["hype","Hype → calm"],["az","A–Z"]];
const IC={
 star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L2.9 9.4l6.3-.9z"/></svg>',
 note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
 sp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
 yt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.5 2.5 0 00-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 002.4 7.2 26 26 0 002 12a26 26 0 00.4 4.8 2.5 2.5 0 001.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.5 2.5 0 001.8-1.8A26 26 0 0022 12a26 26 0 00-.4-4.8zM10 15V9l5.2 3z"/></svg>',
 tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.8A4.3 4.3 0 0115.5 3h-3.2v12.4a2.6 2.6 0 11-2.6-2.6c.3 0 .5 0 .8.1V9.6a5.8 5.8 0 105 5.8V9a7.4 7.4 0 004.3 1.4V7.2a4.3 4.3 0 01-3.2-1.4z"/></svg>',
 info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="#F4EFE6"><path d="M7 4.5v15l12.5-7.5z"/></svg>'
};

/* ---------- state ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let TRACKS=[],UPDATED="",STYLES=[];
let saved=new Set(LS.get("xxi_saved",[])), notes=LS.get("xxi_notes",{});
let st=Object.assign({tab:"all",moods:[],style:"All",sort:"pop",q:"",auto:true,show:[]},LS.get("xxi_state",{}));
if(!Array.isArray(st.show))st.show=[]; if(st.tab==="hot")st.tab="all";
let seen=LS.get("xxi_seen",{}); const DAY=864e5; for(const k in seen)if(Date.now()-seen[k]>14*DAY)delete seen[k];
const isSeen=x=>!!seen[x.t]&&Date.now()-seen[x.t]<3*DAY;
const persist=()=>{LS.set("xxi_saved",[...saved]);LS.set("xxi_notes",notes);LS.set("xxi_state",{tab:st.tab,moods:st.moods,style:st.style,sort:st.sort,auto:st.auto,show:st.show});LS.set("xxi_seen",seen)};
const $=id=>document.getElementById(id);
const feed=$("feed"), aud=$("aud");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc=encodeURIComponent;

/* ---------- derived numbers ---------- */
function perDay(x){const m=(x.stat||"").match(/~?([\d.]+)\s*K\s*(new videos a day|a day)/i)||(x.stat||"").match(/~?([\d.]+)K a day/i);return m?parseFloat(m[1])*1000:0}
function growth(x){const m=(x.stat||"").match(/up\s*(\d+)%/i);return m?+m[1]:0}
function stage(x){if(x.stage)return x.stage; if(growth(x)>=40||(x.new&&!x.hot))return "Rising"; if(x.hot)return "Peak"; return ""}
function fmtK(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,"")+"K":String(n)}


/* ---------- usability ---------- */
const CALMSTYLES=["Piano / Cinematic","Jazz / Lounge","Slowed & Sped up","Indie / Acoustic","Electronic / House"];
function good(x){
  if(x._good)return x._good; const g=new Set(x.good||[]);
  if(x.kind==="instrumental"&&x.e<=3){g.add("Caption reel");g.add("Talk-over")}
  if(x.e<=2&&CALMSTYLES.includes(x.s)){g.add("Caption reel");g.add("B-roll")}
  if(x.moods.includes("motivational"))g.add("Progress / glow-up");
  if(x.e>=4)g.add("Transitions");
  if(x.e>=4&&x.moods.includes("hype")&&["Phonk / Funk","Hip-Hop / Rap","Electronic / House","Rock"].includes(x.s)){g.add("Gym");g.add("Car edit")}
  if(x.trend||x.kind==="original")g.add("Trend format");
  if(x.moods.includes("luxury"))g.add("Aesthetic");
  if(x.moods.includes("playful")&&x.e<=4)g.add("Skit");
  if(x.s==="Christmas")g.add("Seasonal");
  return x._good=[...g];
}
const isInstr=x=>x.kind==="instrumental";
const bizOk=x=>/best bet/i.test(x.biz||"")||x.kind==="instrumental";
function useScore(x){
  const g=good(x); let sc=1;
  ["Caption reel","Progress / glow-up","Trend format","Gym","Car edit","Talk-over"].forEach(k=>{if(g.includes(k))sc+=1.2});
  if(x.kind)sc+=1.5; if(x.new)sc+=1.5; if(stage(x)==="Rising")sc+=1; if(x.hot)sc+=.5;
  const m=(x.src||"").match(/^Global chart #(\d+)/); if(m&&+m[1]>25&&!x.trend)sc-=.8;
  return Math.max(.3,sc);
}
let MIX=new Map();
function buildMix(){ // new random order every load: unseen first, weighted towards usable sounds
  MIX=new Map(TRACKS.map(x=>[x.t,(isSeen(x)?0:10)+Math.pow(Math.random(),1/(useScore(x)**2))]));
}
/* ---------- list ---------- */
function list(){
  const q=st.q.trim().toLowerCase();
  let L=TRACKS.filter(x=>{
    if(st.tab==="new"&&!x.new)return false;
    if(st.tab==="saved"&&!saved.has(x.t))return false;
    if(st.style!=="All"&&x.s!==st.style)return false;
    if(st.show.includes("hot")&&!x.hot)return false;
    if(st.show.includes("instr")&&!isInstr(x))return false;
    if(st.show.includes("orig")&&x.kind!=="original")return false;
    if(st.show.includes("biz")&&!bizOk(x))return false;
    if(st.show.includes("unseen")&&isSeen(x))return false;
    if(st.moods.length&&!st.moods.some(m=>x.moods.includes(m)))return false;
    if(q&&!(x.t+" "+x.a+" "+x.s+" "+x.vibe+" "+x.idea+" "+(x.trend||"")+" "+x.moods.join(" ")+" "+good(x).join(" ")+" "+(notes[x.t]||"")).toLowerCase().includes(q))return false;
    return true;
  });
  const idx=new Map(TRACKS.map((x,i)=>[x.t,i]));
  const mode=st.tab==="charts"?"chart":st.sort;
  const by={pop:(a,b)=>(MIX.get(b.t)||0)-(MIX.get(a.t)||0),chart:(a,b)=>idx.get(a.t)-idx.get(b.t),
    rise:(a,b)=>(growth(b)+(b.new?30:0)+(stage(b)==="Rising"?20:0))-(growth(a)+(a.new?30:0)+(stage(a)==="Rising"?20:0))||idx.get(a.t)-idx.get(b.t),
    calm:(a,b)=>a.e-b.e||idx.get(a.t)-idx.get(b.t),hype:(a,b)=>b.e-a.e||idx.get(a.t)-idx.get(b.t),az:(a,b)=>a.t.localeCompare(b.t)};
  return L.sort(by[mode]||by.pop);
}

/* ---------- active card ---------- */
let io,current=-1;
function observe(){
  io&&io.disconnect();

    const i=+e.target.dataset.i;

}

/* ---------- Apple preview + artwork (JSONP) ---------- */
const cache={}; let cbn=0, unlocked=false;
function jsonp(url){return new Promise(res=>{const n="xxicb"+(cbn++),s=document.createElement("script");
  const done=v=>{clearTimeout(to);delete window[n];s.remove();res(v)};const to=setTimeout(()=>done(null),7000);
  window[n]=d=>done(d);s.onerror=()=>done(null);s.src=url+"&callback="+n;document.head.appendChild(s)})}
function lookup(x){
  if(cache[x.t])return cache[x.t];
  return cache[x.t]=(async()=>{
    const first=x.a.toLowerCase().split(/[ ,&(]/)[0];
    const base=x.t.replace(/\s*\((sped up|slowed|phonk|orchestral version|racing remix|acoustic|funk remix|instrumental)\)\s*/i," ").trim();
    for(const term of [x.t+" "+x.a,base+" "+x.a,x.t]){
      const d=await jsonp(`https://itunes.apple.com/search?term=${enc(term)}&entity=song&limit=10&country=AU`);
      const r=(d&&d.results||[]).filter(r=>r.previewUrl);
      if(r.length){const b=r.find(r=>(r.artistName||"").toLowerCase().includes(first))||r[0];
        return {url:b.previewUrl,art:(b.artworkUrl100||"").replace("100x100bb","600x600bb")}}
    }
    return {url:null,art:null};
  })();
}
async function paintArt(i){
  const x=ITEMS[i]; if(!x||x.kind==="original")return; const r=await lookup(x); const c=cardEl(i); if(!c||!r.art||c.dataset.art)return;
  c.dataset.art=1; const img=c.querySelector(".art img"); img.onload=()=>img.classList.add("on"); img.src=r.art;
  const bg=c.querySelector(".bgart"); bg.style.backgroundImage=`url("${r.art}")`; bg.classList.add("on");
  c.querySelector(".mdisc").style.backgroundImage=`url("${r.art}")`;
}
const fmt=s=>`0:${String(Math.floor(s||0)).padStart(2,"0")}`;
function setTxt(i,t){const c=cardEl(i);if(c)c.querySelector(".ptxt").textContent=t}
function setPlaying(on){
  const c=cardEl(current); feed.querySelectorAll(".card.playing").forEach(k=>k!==c&&k.classList.remove("playing"));
  if(!c)return; c.classList.toggle("playing",on); c.classList.toggle("isPaused",!on&&unlocked&&!!aud.src&&!aud.src.startsWith("blob:"));
}
async function playFor(i){
  aud.pause(); feed.querySelectorAll(".card.isPaused").forEach(c=>c.classList.remove("isPaused"));
  const x=ITEMS[i]; if(!x||!unlocked)return;
  if(x.kind==="original"){setTxt(i,"original audio · tap Hear it");return}
  setTxt(i,"loading…");
  const r=await lookup(x); if(current!==i)return;
  if(!r.url){setTxt(i,"no preview · try Spotify");return}
  aud.loop=!st.auto; if(aud.src!==r.url)aud.src=r.url;
  try{aud.currentTime=0}catch(e){}
  try{await aud.play();setPlaying(true)}catch(e){setTxt(i,"tap to play")}
  for(let k=i+1;k<=i+3;k++)if(ITEMS[k])lookup(ITEMS[k]);
}

aud.addEventListener("ended",()=>{if(!st.auto)return;const n=cardEl(current+1)||feed.querySelector(".card.end");if(n)n.scrollIntoView({behavior:"smooth"})});

feed.addEventListener("click",e=>{

  lastTap=now;

    if(!unlocked){unlocked=true;return playFor(i)}

    if(aud.paused){if(!aud.src||aud.src.startsWith("blob:"))return playFor(i);try{await aud.play();setPlaying(true)}catch(e){}}

    <dt>Film it</dt><dd>${esc(x.idea)}</dd>
    <dt>Business use</dt><dd>${esc(x.biz||(isInstr(x)?"Instrumental: usually the safest bet. Check it’s in the Commercial Music Library in-app.":x.kind==="original"?"Original audio: check in-app before posting from a business account.":"Not checked. Big chart songs are often blocked on business accounts."))}</dd>
    ${notes[x.t]?`<dt>Your note</dt><dd>${esc(notes[x.t])}</dd>`:""}
   </dl>
   <div class="row"><button class="obtn" id="mCopy">Copy name</button><button class="gbtn" id="mNote">${notes[x.t]?"Edit note":"Add note"}</button></div>`;
  $("mCopy").onclick=()=>copy(`${x.t} — ${x.a}`,"Copied — paste it into TikTok's sound search");
  $("mNote").onclick=()=>openNote(x);
  sheet("shMore");
}

// copy saved list
function copy(text,msg){
  const ok=()=>toast(msg||"Copied");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(()=>fallback())}else fallback();
  function fallback(){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();
    try{document.execCommand("copy");ok()}catch(e){toast("Couldn't copy")}t.remove()}
}
$("copyFab").onclick=()=>{
  const L=TRACKS.filter(x=>saved.has(x.t)).map(x=>`• ${x.t} — ${x.a}${notes[x.t]?`\n   ↳ ${notes[x.t]}`:""}`);
  copy(`XXI fin. saved sounds (${L.length})\n\n`+L.join("\n"),`Copied ${L.length} sounds`);
};

let toastT; function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1600)}

/* ---------- start / unlock ---------- */
function silentWav(){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>[...s].forEach((c,k)=>v.setUint8(o+k,c.charCodeAt(0)));
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);
  for(let k=0;k<n;k++)v.setUint8(44+k,128);return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
$("start").addEventListener("click",()=>{$("start").classList.add("hide");aud.src=silentWav();
  aud.play().catch(()=>{}).finally(()=>{unlocked=true;playFor(current<0?0:current)})});

/* ---------- load ---------- */
async function load(keepPos){
  try{const r=await fetch("tracks.json?v="+Date.now(),{cache:"no-store"});const d=await r.json();TRACKS=d.tracks||[];UPDATED=d.updated_label||""}
  catch(e){feed.innerHTML=`<div class="empty">Couldn't load the sound list.<br>Check your connection and reopen.</div>`;return}
  const have=new Set(TRACKS.map(x=>x.s));
  STYLES=[...STYLE_ORDER.filter(s=>have.has(s)),...[...have].filter(s=>!STYLE_ORDER.includes(s))];
  if(st.style!=="All"&&!have.has(st.style))st.style="All";
  st.moods=st.moods.filter(m=>MLABEL[m]);
  buildMix();
  if(!keepPos){renderFeed()}
}
let lastLoad=Date.now();
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||Date.now()-lastLoad<30*60*1000)return;
  lastLoad=Date.now();const before=UPDATED;await load(true);if(UPDATED!==before){current=-1;renderFeed();toast("New sounds loaded ✨")}
});
load();
</script>
